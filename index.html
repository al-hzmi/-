.getElementById('root').innerHTML='<div style="padding:30px;font-family:Arial;direction:rtl"><h2>تعذر تحميل المعاينة</h2><pre style="direction:ltr;white-space:pre-wrap">'+String(e.stack||e).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))+'</pre></div>'}})();</script></body></html>
